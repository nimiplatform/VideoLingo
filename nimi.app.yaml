app_id: ai.nimi.videolingo
display_name: VideoLingo
version: 0.1.7
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
capability_contract_refs:
  - audio.transcribe
  - audio.separate
  - text.generate
  - text.annotate
  - audio.synthesize
  - voice.create
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
metadata:
  summary: VideoLingo的Nimi生态适配：媒体导入、字幕校对、配音与批量处理。生成内容需要人工校对。
  icon: docs/public/apple-touch-icon.png
  readme: docs/nimi-development.md
  release_notes: RELEASE_NOTES.md
  author: VideoLingo contributors
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1467
    host_source_directory: src-electron
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features:
      - realistic-voice-replication
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: video
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: true
    telemetry: []
    third_party_account: optional
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
